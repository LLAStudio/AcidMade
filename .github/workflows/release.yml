name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Tag and draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"
      - name: Create the tag when it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists."
          else
            git tag -a "$TAG" -m "AcidMade $TAG"
            git push origin "refs/tags/$TAG"
            echo "Tag $TAG created at $(git rev-parse --short HEAD)."
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it."
          else
            gh release create "$TAG" \
              --draft \
              --title "AcidMade $TAG" \
              --target main \
              --generate-notes
            echo "Draft release $TAG created."
          fi
      - name: Summary
        run: |
          {
            echo "### Draft release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "The tag exists before any build runs, so a failing platform can no"
            echo "longer prevent the release from being created."
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux · AppImage + Flatpak
    needs: prepare
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Build Flatpak
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
          npx electron-builder --linux flatpak --publish never
      - name: Collect the AppImage even when Flatpak failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.flatpak

  windows:
    name: Windows · Setup, MSI, Portable
    needs: prepare
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Signing status
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Windows code signing certificate detected."
          else
            echo "::warning::WIN_CSC_LINK is not set, so the Windows installers will be unsigned and SmartScreen will warn."
          fi
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never
      - name: Build MSI
        continue-on-error: true
        run: npx electron-builder --win msi --publish never
      - name: Collect what was built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.msi

  macos:
    name: macOS · DMG + .app
    needs: prepare
    runs-on: macos-14
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build, sign and notarize
        run: |
          set -euo pipefail
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::MAC_CSC_LINK is not set, so the app will be unsigned and Gatekeeper will block it."
          fi
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple credentials detected: notarizing."
            npx electron-builder --mac dmg zip dir --publish never -c.mac.notarize=true
          else
            echo "::warning::Apple notarization credentials are not set; the DMG will be signed at most, not notarized."
            npx electron-builder --mac dmg zip dir --publish never
          fi
      - name: Verify signature and notarization
        if: env.CSC_LINK != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP=$(ls -d release/mac*/AcidMade.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP" || echo "::warning::spctl rejected the app; notarization may be missing."
          for DMG in release/*.dmg; do
            xcrun stapler validate "$DMG" || echo "::warning::$DMG is not stapled."
          done
          echo "Checked $VERSION bundle at $APP"
      - name: Zip the .app bundles
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release
          if [ -d mac/AcidMade.app ]; then
            ditto -c -k --sequesterRsrc --keepParent mac/AcidMade.app "AcidMade-$VERSION-x64-app.zip"
          fi
          if [ -d mac-arm64/AcidMade.app ]; then
            ditto -c -k --sequesterRsrc --keepParent mac-arm64/AcidMade.app "AcidMade-$VERSION-arm64-app.zip"
          fi
      - name: Collect the DMGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-app.zip

  publish:
    name: Attach artifacts to the draft
    needs: [prepare, linux, windows, macos]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: List what was collected
        id: collected
        run: |
          set -euo pipefail
          COUNT=$(find artifacts -type f 2>/dev/null | wc -l | tr -d ' ')
          echo "files=$COUNT" >> "$GITHUB_OUTPUT"
          find artifacts -type f -printf '%f (%s bytes)\n' 2>/dev/null || true
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No artifacts were produced; the draft release keeps its tag and notes only."
          fi
      - name: Attach the artifacts
        if: steps.collected.outputs.files != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AcidMade ${{ needs.prepare.outputs.tag }}
          draft: true
          allowUpdates: true
          files: artifacts/**/*
      - name: Publish only when every platform succeeded
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          LINUX="${{ needs.linux.result }}"
          WINDOWS="${{ needs.windows.result }}"
          MACOS="${{ needs.macos.result }}"
          echo "linux=$LINUX windows=$WINDOWS macos=$MACOS"
          if [ "$LINUX" = "success" ] && [ "$WINDOWS" = "success" ] && [ "$MACOS" = "success" ]; then
            gh release edit "$TAG" --draft=false
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $TAG stays a draft: linux=$LINUX windows=$WINDOWS macos=$MACOS. Artifacts from the successful platforms are attached; publish it manually once the rest is green."
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ needs.prepare.outputs.tag }}"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo ""
            echo "Artifacts attached: ${{ steps.collected.outputs.files }}"
            echo "Published: ${{ steps.publish.outputs.published }}"
          } >> "$GITHUB_STEP_SUMMARY"
