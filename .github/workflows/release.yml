name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A new push supersedes the previous release attempt; otherwise a stuck
  # platform job blocks every later release behind it.
  cancel-in-progress: true

jobs:
  prepare:
    name: Tag and draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"
      - name: Create the tag when it does not exist yet
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          git fetch --tags --force
          if git rev-parse -q --verify "refs/tags/$TAG" > /dev/null; then
            echo "Tag $TAG already exists."
          else
            # Lightweight tag on purpose: git tag -a needs an identity that the
            # runner does not configure, and fails with exit code 128.
            git tag "$TAG"
            git push origin "refs/tags/$TAG"
            echo "Tag $TAG created at $(git rev-parse --short HEAD)."
          fi
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it."
          else
            gh release create "$TAG" \
              --draft \
              --title "AcidMade $TAG" \
              --target main \
              --generate-notes
            echo "Draft release $TAG created."
          fi
      - name: Summary
        run: |
          {
            echo "### Draft release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "The tag exists before any build runs, so a failing platform can no"
            echo "longer prevent the release from being created."
          } >> "$GITHUB_STEP_SUMMARY"

  linux:
    name: Linux · AppImage + Flatpak
    needs: prepare
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Build Flatpak
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
          npx electron-builder --linux flatpak --publish never
      - name: Collect the AppImage even when Flatpak failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.flatpak

  windows:
    name: Windows · Setup, MSI, Portable
    needs: prepare
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Signing status
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Windows code signing certificate detected."
          else
            echo "::warning::WIN_CSC_LINK is not set, so the Windows installers will be unsigned and SmartScreen will warn."
          fi
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never
      - name: Build MSI
        continue-on-error: true
        run: npx electron-builder --win msi --publish never
      - name: Collect what was built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.msi

  macos:
    name: macOS · DMG (${{ matrix.arch }})
    needs: prepare
    # macos-13 was retired on 4 December 2025: jobs kept waiting for a runner
    # that no longer exists and never produced a DMG. macos-15-intel is the
    # supported x64 image and macos-15 is arm64, so one job builds each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A queued macOS runner must never hold the release hostage.
    timeout-minutes: 40
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Ensure the DMG helper is installed
        # dmg-license is only an optional dependency of dmg-builder, and the
        # module is required at load time for every macOS target, not just for
        # licensed DMGs. A lockfile generated on Linux can leave it out, and the
        # build then dies with "Cannot find module 'dmg-license'" before it
        # writes anything.
        run: |
          set -euo pipefail
          if node -e "require.resolve('dmg-license')" 2>/dev/null; then
            echo "dmg-license is already installed."
          else
            npm install --no-save --no-package-lock dmg-license@^1.0.11
          fi
      - name: Build, sign and notarize
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/mac-build.log"
          report() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::electron-builder exited with status $status"
              tail -n 12 "$LOG" 2>/dev/null | while IFS= read -r line; do
                echo "::error::${line}"
              done
            fi
          }
          trap report EXIT
          echo "node $(node -v) on $(uname -m), disk:"
          df -h . | tail -1
          npm ls dmg-license --depth=0 || true
          if [ -z "${CSC_LINK:-}" ]; then
            echo "::warning::MAC_CSC_LINK is not set, so the app will be unsigned and Gatekeeper will block it."
          fi
          ARGS=(--mac dmg zip dir "--${{ matrix.arch }}" --publish never
            -c.mac.artifactName='AcidMade-${version}-${arch}.${ext}')
          if [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_APP_SPECIFIC_PASSWORD:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            echo "Apple credentials detected: notarizing."
            ARGS+=(-c.mac.notarize=true)
          else
            echo "::warning::Apple notarization credentials are not set; the DMG will be signed at most, not notarized."
          fi
          npx electron-builder "${ARGS[@]}" 2>&1 | tee "$LOG"
      - name: Verify signature and notarization
        if: env.CSC_LINK != ''
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP=$(ls -d release/mac*/AcidMade.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP" || echo "::warning::spctl rejected the app; notarization may be missing."
          for DMG in release/*.dmg; do
            xcrun stapler validate "$DMG" || echo "::warning::$DMG is not stapled."
          done
          echo "Checked $VERSION bundle at $APP"
      - name: Zip the .app bundles
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR="mac-arm64"
          if [ "${{ matrix.arch }}" = "x64" ]; then APP_DIR="mac"; fi
          cd release
          if [ -d "$APP_DIR/AcidMade.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/AcidMade.app" "AcidMade-$VERSION-${{ matrix.arch }}-app.zip"
          else
            echo "::warning::No $APP_DIR/AcidMade.app to zip."
          fi
      - name: Collect the DMGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-app.zip

  publish:
    name: Attach artifacts to the draft
    needs: [prepare, linux, windows, macos]
    if: always() && needs.prepare.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: List what was collected
        id: collected
        run: |
          set -euo pipefail
          mkdir -p artifacts
          COUNT=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "files=$COUNT" >> "$GITHUB_OUTPUT"
          find artifacts -type f -printf '%f (%s bytes)\n' 2>/dev/null || true
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No artifacts were produced; the draft release keeps its tag and notes only."
          fi
      - name: Attach the artifacts
        if: steps.collected.outputs.files != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AcidMade ${{ needs.prepare.outputs.tag }}
          draft: true
          allowUpdates: true
          files: artifacts/**/*
      - name: Publish only when every platform succeeded
        id: publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          LINUX="${{ needs.linux.result }}"
          WINDOWS="${{ needs.windows.result }}"
          MACOS="${{ needs.macos.result }}"
          echo "linux=$LINUX windows=$WINDOWS macos=$MACOS"
          # Linux and Windows are required; macOS is published when it succeeds,
          # and a macOS failure no longer blocks the release on its own.
          if [ "$LINUX" = "success" ] && [ "$WINDOWS" = "success" ]; then
            gh release edit "$TAG" --draft=false
            echo "published=true" >> "$GITHUB_OUTPUT"
            if [ "$MACOS" != "success" ]; then
              echo "::warning::Published $TAG without macOS artifacts (macos=$MACOS). Add them by re-running the macOS job and re-running publish."
            fi
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Release $TAG stays a draft: linux=$LINUX windows=$WINDOWS macos=$MACOS. Artifacts from the successful platforms are attached; publish it manually once the rest is green."
          fi
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ needs.prepare.outputs.tag }}"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo ""
            echo "Artifacts attached: ${{ steps.collected.outputs.files }}"
            echo "Published: ${{ steps.publish.outputs.published }}"
          } >> "$GITHUB_STEP_SUMMARY"
