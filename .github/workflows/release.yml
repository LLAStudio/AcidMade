name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  # Manual runs verify the build only; releases come from v* tags.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  # A new push supersedes the previous release attempt; otherwise a stuck
  # platform job blocks every later release behind it.
  cancel-in-progress: true

jobs:
  prepare:
    name: Draft release
    needs: verify
    # Only a tag creates a release. A push on main finishes after `verify` and
    # never touches the release, its assets or its tag.
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      build_linux: ${{ steps.plan.outputs.build_linux }}
      build_windows: ${{ steps.plan.outputs.build_windows }}
      build_macos: ${{ steps.plan.outputs.build_macos }}
      needs_publish: ${{ steps.plan.outputs.needs_publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION" >> "$GITHUB_OUTPUT"
          echo "Releasing $VERSION"
      - name: Check the tag matches the package version
        # The workflow never creates a tag: a release is exactly a pushed tag.
        # Rejecting a mismatch keeps the assets tied to the commit the tag names.
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json ($TAG)."
            echo "::error::Bump the version, push the commit, then push v<new version>. Nothing was released."
            exit 1
          fi
          echo "Releasing $TAG from $(git rev-parse --short HEAD)."
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; keeping it."
          else
            gh release create "$TAG" \
              --draft \
              --title "AcidMade $TAG" \
              --target main \
              --generate-notes
            echo "Draft release $TAG created."
          fi
      - name: Decide what still needs building
        # The release is the source of truth: a tag whose release already has
        # every required artifact rebuilds nothing, a missing DMG only rebuilds
        # macOS. This job never runs for a push on main.
        id: plan
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
        run: node scripts/release-plan.mjs
      - name: Summary
        run: |
          {
            echo "### Release ${{ steps.version.outputs.tag }}"
            echo ""
            echo "Triggered by the tag ${{ github.ref_name }}; pushes on main only verify"
            echo "the build and never touch a release."
            echo ""
            echo "Rebuild plan: linux=\`${{ steps.plan.outputs.build_linux }}\`, "
            echo "windows=\`${{ steps.plan.outputs.build_windows }}\`, "
            echo "macos=\`${{ steps.plan.outputs.build_macos }}\`, "
            echo "publish=\`${{ steps.plan.outputs.needs_publish }}\`."
          } >> "$GITHUB_STEP_SUMMARY"

  verify:
    name: Verify the build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs on every push, including main. On a tag it also gates the release:
    # a build or container regression stops the run before a draft exists.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build the app
        run: npm run build
      - name: Create, edit, corrupt and reopen projects
        run: npm run verify:acm

  linux:
    name: Linux · AppImage + Flatpak
    needs: [prepare, verify]
    if: needs.prepare.outputs.build_linux == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Build Flatpak
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
          npx electron-builder --linux flatpak --publish never
      - name: Collect the AppImage even when Flatpak failed
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.AppImage
            release/*.flatpak

  windows:
    name: Windows · Setup, MSI, Portable
    needs: [prepare, verify]
    if: needs.prepare.outputs.build_windows == 'true'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Signing status
        shell: bash
        run: |
          if [ -n "$CSC_LINK" ]; then
            echo "Windows code signing certificate detected."
          else
            echo "::warning::WIN_CSC_LINK is not set, so the Windows installers will be unsigned and SmartScreen will warn."
          fi
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never
      - name: Build MSI
        continue-on-error: true
        run: npx electron-builder --win msi --publish never
      - name: Collect what was built
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.exe
            release/*.msi

  macos:
    name: macOS · DMG (${{ matrix.arch }})
    needs: [prepare, verify]
    if: needs.prepare.outputs.build_macos == 'true'
    # macos-13 was retired on 4 December 2025: jobs kept waiting for a runner
    # that no longer exists and never produced a DMG. macos-15-intel is the
    # supported x64 image and macos-15 is arm64, so one job builds each.
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15-intel
            arch: x64
          - runner: macos-15
            arch: arm64
    runs-on: ${{ matrix.runner }}
    # A queued macOS runner must never hold the release hostage.
    timeout-minutes: 40
    env:
      CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Check the DMG helper is available
        # dmg-license is an optional darwin dependency of dmg-builder, required
        # at load time for every macOS target, not just licensed DMGs. The
        # lockfile resolves it for darwin, so npm ci must install it here.
        # Installing it in this step would mutate node_modules after npm ci and
        # hide the lockfile problem until the next clean install; fail instead.
        run: |
          set -euo pipefail
          RESOLVED=$(node -p "require.resolve('dmg-license')" 2>/dev/null || true)
          if [ -n "$RESOLVED" ]; then
            echo "dmg-license resolved at $RESOLVED"
            exit 0
          fi
          echo "::error::dmg-license is missing, so electron-builder cannot build the DMG."
          echo "::error::It is an optional darwin dependency of dmg-builder and must be installed by npm ci from package-lock.json."
          echo "::error::Check that package-lock.json still contains node_modules/dmg-license (os: darwin), then rerun npm ci on macOS. Do not install it in CI."
          exit 1
      - name: Check the macOS signing inputs
        # A wrong MAC_CSC_LINK fails here, with the reason, instead of shipping
        # a DMG that Gatekeeper blocks without explanation.
        id: signing
        run: node scripts/check-mac-signing.mjs
      - name: Build, sign and notarize
        id: build
        env:
          SIGN_MAC: ${{ steps.signing.outputs.signed }}
          NOTARIZE_MAC: ${{ steps.signing.outputs.notarize }}
        run: |
          set -euo pipefail
          LOG="$RUNNER_TEMP/mac-build.log"
          report() {
            status=$?
            if [ "$status" -ne 0 ]; then
              echo "::error::electron-builder exited with status $status"
              { grep -F '⨯' "$LOG" || true; tail -n 20 "$LOG"; } \
                | awk '!seen[$0]++' \
                | while IFS= read -r line; do echo "::error::${line}"; done
            fi
          }
          trap report EXIT
          echo "node $(node -v) on $(uname -m), disk:"
          df -h . | tail -1
          npm ls dmg-license --depth=0 || true
          ARGS=(--mac dmg zip dir "--${{ matrix.arch }}" --publish never
            -c.mac.artifactName='AcidMade-${version}-${arch}.${ext}')
          if [ "$SIGN_MAC" = "true" ]; then
            echo "Signing with the configured Developer ID certificate."
            if [ "$NOTARIZE_MAC" = "true" ]; then
              echo "Apple credentials present: notarizing."
              ARGS+=(-c.mac.notarize=true)
            else
              echo "::warning::No Apple notarization secrets; the DMG will be signed but not notarized."
            fi
          else
            echo "::warning::No macOS certificate secret; building unsigned (Gatekeeper will block it)."
            # Without a certificate electron-builder still attempts an ad-hoc
            # hardened-runtime signature and fails before writing the DMG.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
            unset CSC_LINK CSC_KEY_PASSWORD
            ARGS+=(-c.mac.hardenedRuntime=false)
          fi
          npx electron-builder "${ARGS[@]}" 2>&1 | tee "$LOG"
      - name: Verify signature and notarization
        if: steps.signing.outputs.signed == 'true'
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP=$(ls -d release/mac*/AcidMade.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP" || echo "::warning::spctl rejected the app; notarization may be missing."
          for DMG in release/*.dmg; do
            xcrun stapler validate "$DMG" || echo "::warning::$DMG is not stapled."
          done
          echo "Checked $VERSION bundle at $APP"
      - name: Zip the .app bundles
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          APP_DIR="mac-arm64"
          if [ "${{ matrix.arch }}" = "x64" ]; then APP_DIR="mac"; fi
          cd release
          if [ -d "$APP_DIR/AcidMade.app" ]; then
            ditto -c -k --sequesterRsrc --keepParent "$APP_DIR/AcidMade.app" "AcidMade-$VERSION-${{ matrix.arch }}-app.zip"
          else
            echo "::warning::No $APP_DIR/AcidMade.app to zip."
          fi
      - name: Collect the DMGs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 7
          path: |
            release/*.dmg
            release/*-app.zip

  publish:
    name: Attach artifacts to the draft
    needs: [prepare, verify, linux, windows, macos]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.needs_publish == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        id: download
        continue-on-error: true
        with:
          path: artifacts
          merge-multiple: true
      - name: List what was collected
        id: collected
        run: |
          set -euo pipefail
          mkdir -p artifacts
          COUNT=$(find artifacts -type f | wc -l | tr -d ' ')
          echo "files=$COUNT" >> "$GITHUB_OUTPUT"
          find artifacts -type f -printf '%f (%s bytes)\n' 2>/dev/null || true
          if [ "$COUNT" = "0" ]; then
            echo "::warning::No artifacts were produced; the draft release keeps its tag and notes only."
          fi
      - name: Attach the artifacts
        if: needs.verify.result == 'success' && steps.collected.outputs.files != '0'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: AcidMade ${{ needs.prepare.outputs.tag }}
          draft: true
          allowUpdates: true
          files: artifacts/**/*
      - name: Check the release assets
        # Decisions read the release itself, not this run's jobs: a run that only
        # rebuilt macOS must still see the Linux and Windows assets from an
        # earlier attempt, and a missing DMG must still stop the release.
        id: assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          VERSION="${{ needs.prepare.outputs.version }}"
          ASSETS=$(gh release view "$TAG" --json assets --jq '.assets[].name')
          echo "Assets on $TAG:"
          printf '%s\n' "$ASSETS"
          has() { printf '%s\n' "$ASSETS" | grep -Fxq "$1"; }
          DMG_MISSING=""
          for ARCH in x64 arm64; do
            has "AcidMade-${VERSION}-${ARCH}.dmg" || DMG_MISSING="$DMG_MISSING $ARCH"
          done
          if [ -n "$DMG_MISSING" ]; then
            echo "::error::Missing macOS disk image(s) for:$DMG_MISSING"
            echo "::error::Every release must ship AcidMade-${VERSION}-x64.dmg and AcidMade-${VERSION}-arm64.dmg; $TAG stays a draft."
            echo "dmg=false" >> "$GITHUB_OUTPUT"
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "dmg=true" >> "$GITHUB_OUTPUT"
          OTHER_MISSING=""
          for FILE in "AcidMade-${VERSION}-Setup.exe" "AcidMade-${VERSION}-Portable.exe" "AcidMade-${VERSION}-x86_64.AppImage"; do
            has "$FILE" || OTHER_MISSING="$OTHER_MISSING $FILE"
          done
          if [ -n "$OTHER_MISSING" ]; then
            echo "::warning::Missing artifact(s):$OTHER_MISSING; $TAG stays a draft."
            echo "complete=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "complete=true" >> "$GITHUB_OUTPUT"
      - name: Publish when the full artifact set is present
        # The .acm check gates publication too: a container regression must not
        # un-draft a release, even when every installer already exists.
        id: publish
        if: needs.verify.result == 'success' && steps.assets.outputs.complete == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ needs.prepare.outputs.tag }}"
          gh release edit "$TAG" --draft=false
          echo "published=true" >> "$GITHUB_OUTPUT"
      - name: Summary
        if: always()
        run: |
          {
            echo "### ${{ needs.prepare.outputs.tag }}"
            echo ""
            echo "| Platform | Result |"
            echo "| --- | --- |"
            echo "| Verify | ${{ needs.verify.result }} |"
            echo "| Linux | ${{ needs.linux.result }} |"
            echo "| Windows | ${{ needs.windows.result }} |"
            echo "| macOS | ${{ needs.macos.result }} |"
            echo "| DMGs | ${{ steps.assets.outputs.dmg }} |"
            echo ""
            echo "Artifacts attached: ${{ steps.collected.outputs.files }}"
            echo "Published: ${{ steps.publish.outputs.published }}"
          } >> "$GITHUB_STEP_SUMMARY"
