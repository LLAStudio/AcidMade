name: Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  CSC_IDENTITY_AUTO_DISCOVERY: "false"

jobs:
  linux:
    name: Linux · AppImage + Flatpak
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build AppImage
        run: npx electron-builder --linux AppImage --publish never
      - name: Build Flatpak
        continue-on-error: true
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive -y flathub org.freedesktop.Platform//24.08 org.freedesktop.Sdk//24.08 org.electronjs.Electron2.BaseApp//24.08
          npx electron-builder --linux flatpak --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          if-no-files-found: error
          path: |
            release/*.AppImage
            release/*.flatpak

  windows:
    name: Windows · Setup, MSI, Portable
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build installer and portable app
        run: npx electron-builder --win nsis portable --publish never
      - name: Build MSI
        continue-on-error: true
        run: npx electron-builder --win msi --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          path: |
            release/*.exe
            release/*.msi

  macos:
    name: macOS · DMG + .app
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run icon
      - run: npm run build
      - name: Build DMG, zip and .app bundles
        run: npx electron-builder --mac dmg zip dir --publish never
      - name: Zip the .app bundles
        run: |
          VERSION=$(node -p "require('./package.json').version")
          cd release
          if [ -d mac/AcidMade.app ]; then
            ditto -c -k --sequesterRsrc --keepParent mac/AcidMade.app "AcidMade-$VERSION-x64-app.zip"
          fi
          if [ -d mac-arm64/AcidMade.app ]; then
            ditto -c -k --sequesterRsrc --keepParent mac-arm64/AcidMade.app "AcidMade-$VERSION-arm64-app.zip"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          if-no-files-found: error
          path: |
            release/*.dmg
            release/*-app.zip

  release:
    name: Publish GitHub release
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: AcidMade v${{ steps.version.outputs.version }}
          target_commitish: main
          allowUpdates: true
          generate_release_notes: true
          files: artifacts/**/*
